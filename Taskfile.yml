version: "3"

vars:
  BINARY_NAME: todoui
  BUILD_DIR: .
  # ~/.local/bin precedes ~/go/bin on PATH. Installing a dev build to $GOBIN
  # lets the released binary shadow it, so committed changes look like they
  # never took effect.
  INSTALL_DIR: "{{.HOME}}/.local/bin"
  VERSION:
    sh: git describe --tags --always --dirty

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  # A worktree is a clean checkout, so everything gitignored is absent. The
  # module cache comes back from go.sum.
  setup:
    desc: Make a fresh checkout runnable
    cmds:
      - go mod download

  build:
    desc: Build the todoui binary
    cmds:
      - echo "Building {{.BINARY_NAME}}..."
      - go build -ldflags "-s -w -X github.com/datapointchris/todoui/cli.version={{.VERSION}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}} .
      - echo "Build complete{{":"}} {{.BUILD_DIR}}/{{.BINARY_NAME}}"
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY_NAME}}"

  test:
    desc: Run all tests
    cmds:
      - echo "Running tests..."
      - go test -v ./...

  install:
    desc: Build and install the dev build to ~/.local/bin
    deps:
      - build
    cmds:
      - echo "Installing {{.BINARY_NAME}} to {{.INSTALL_DIR}}..."
      - mkdir -p {{.INSTALL_DIR}}
      - cp {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.INSTALL_DIR}}/{{.BINARY_NAME}}
      - chmod +x {{.INSTALL_DIR}}/{{.BINARY_NAME}}
      - echo "Installed{{":"}} {{.INSTALL_DIR}}/{{.BINARY_NAME}}"

  clean:
    desc: Remove build artifacts
    cmds:
      - echo "Cleaning..."
      - rm -f {{.BUILD_DIR}}/{{.BINARY_NAME}}
