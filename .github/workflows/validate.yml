# forge-toolchain: 20
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:

  go:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      # generated:go
      - uses: actions/setup-go@v7
        with:
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this needs the component path.
          go-version-file: "./go.mod"
          cache: true

      - run: go build ./...

      - run: go vet ./...

      - run: go test ./...

      # --allow-parallel-runners because a repo with two Go components runs two
      # of these jobs at once, and golangci-lint takes a lock on its shared
      # cache under $HOME. A hosted runner gives each job its own machine, so
      # they never meet; a self-hosted one is a single box and the second job
      # dies with "parallel golangci-lint is running" and exit 3. The flag makes
      # it wait for the lock instead.
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          golangci-lint run --allow-parallel-runners

      # Two classes of advisory this catches and a lockfile scan does not. An
      # unmaintained transitive dependency reaches a repo through something it
      # imports rather than through anything it declares. And the `go` directive
      # picks the toolchain that compiles the binary, so a stale one takes a
      # stale standard library with it.
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      # > custom:after:go - sqlc drift and the Taskfile build path
      #
      # The generated checkout is depth 1 with no tags, so the Taskfile's
      # `git describe --tags --always` would silently fall back to a bare
      # commit hash and the step would stop resembling a real build.
      - name: Fetch tags
        run: git fetch --prune --tags --unshallow || git fetch --prune --tags

      # Pinned to the version generating the committed code — a newer sqlc can
      # emit different output and fail here while passing locally.
      - name: Check sqlc generated code is current
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          cd db && sqlc diff

      # Executes the Taskfile so its build paths cannot silently rot again, as
      # they did for 109 days after the package layout flatten.
      - name: Build via Taskfile
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          task build
