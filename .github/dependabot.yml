version: 2
updates:
  # Nothing otherwise reports that a dependency moved. The sqlite driver had
  # drifted six minor versions before an audit caught it by hand.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
