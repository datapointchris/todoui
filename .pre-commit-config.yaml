default_stages: [pre-commit]
repos:
  # Conventional commits enforcement
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=1000']
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ['--fix=lf']
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        args: [--fix]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: prepare-commit-msg
        name: Strip AI branding from commits
        entry: bash -c 'exec "$HOME/.claude/hooks/prepare-commit-msg" "$@"' --
        language: system
        always_run: true
        stages: [prepare-commit-msg]

  # Go hooks
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.1
    hooks:
      - id: go-fumpt-repo
        stages: [pre-commit]
      - id: go-vet-repo-mod
        stages: [pre-commit]
      - id: go-build-repo-mod
        stages: [pre-commit]
      - id: go-mod-tidy-repo
        stages: [pre-commit]
      - id: go-test-repo-mod
        stages: [pre-commit]
      - id: golangci-lint-repo-mod
        stages: [pre-commit]

# > custom:after:go - sqlc generated code freshness and workflow linting
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      # check-yaml proves the workflows parse, not that they are valid Actions.
      # A misspelled `needs:` or `permissions:` parses fine and silently does
      # nothing — in a repo where both workflows gate the release.
      - id: actionlint
        stages: [pre-commit]

  - repo: local
    hooks:
      # Catches a schema or query edit committed without regenerating.
      - id: sqlc-diff
        name: sqlc generated code is current
        entry: bash -c 'cd db && sqlc diff'
        language: system
        files: ^db/.*\.(sql|yaml)$
        pass_filenames: false
        stages: [pre-commit]
