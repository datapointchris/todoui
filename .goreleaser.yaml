version: 2

builds:
  - main: .
    binary: todoui
    ldflags:
      - -s -w
      - -X github.com/datapointchris/todoui/cli.version={{ .Tag }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "todoui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
